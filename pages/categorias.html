<!-- ==========================================================
     CATEGORIAS
========================================================== -->

<section class="categorias">

    <!-- Cabeçalho -->

    <div class="page-header">

        <div>

            <h1>Categorias</h1>

            <p>Gerenciamento de categorias da BEQ Empreendimentos.</p>

        </div>

        <button
            id="btnNovaCategoria"
            class="btn btn-primary">

            <i class="fa-solid fa-plus"></i>

            Nova Categoria

        </button>

    </div>


    <!-- Dashboard -->

    <div class="dashboard-cards">

        <div class="card dashboard-card">

            <div>

                <span>Total de Categorias</span>

                <h2 id="totalCategorias">0</h2>

            </div>

            <i class="fa-solid fa-tags"></i>

        </div>

    </div>


    <!-- Pesquisa -->

    <div class="card">

        <div class="form-group">

            <label class="form-label">

                Pesquisar categoria

            </label>

            <input

                type="text"

                id="pesquisarCategoria"

                class="form-control"

                placeholder="Digite o nome da categoria..."

            >

        </div>

    </div>


    <!-- Botão Mostrar -->

    <div class="table-toggle">

        <button

            id="btnMostrarCategorias"

            class="btn btn-secondary">

            <i class="fa-solid fa-list"></i>

            Mostrar Categorias

        </button>

    </div>


    <!-- Tabela -->

    <div

        class="card hidden"

        id="cardTabelaCategorias">

        <div class="table-responsive">

            <table class="table">

                <thead>

                    <tr>

                        <th>Código</th>

                        <th>Categoria</th>

                        <th>Descrição</th>

                        <th width="140">

                            Ações

                        </th>

                    </tr>

                </thead>

                <tbody id="listaCategorias">

                    <tr>

                        <td

                            colspan="4"

                            class="empty-table">

                            Nenhuma categoria cadastrada.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>



<!-- ==========================================================
     MODAL
========================================================== -->

<div

    id="modalCategoria"

    class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2>

                Nova Categoria

            </h2>

            <button

                id="fecharModalCategoria"

                class="btn-close">

                &times;

            </button>

        </div>


        <div class="modal-body">

            <div class="form-group">

                <label class="form-label">

                    Código

                </label>

                <input

                    type="text"

                    id="categoriaCodigo"

                    class="form-control"

                    readonly

                >

            </div>


            <div class="form-group">

                <label class="form-label">

                    Categoria

                </label>

                <input

                    type="text"

                    id="categoriaNome"

                    class="form-control"

                    placeholder="Ex.: Cimento"

                >

            </div>


            <div class="form-group"

                style="grid-column:1 / -1;">

                <label class="form-label">

                    Descrição

                </label>

                <textarea

                    id="categoriaDescricao"

                    class="form-control"

                    rows="4"

                    placeholder="Descrição da categoria">

                </textarea>

            </div>

        </div>


        <div class="modal-footer">

            <button

                id="cancelarCategoria"

                class="btn btn-secondary">

                Cancelar

            </button>

            <button

                id="salvarCategoria"

                class="btn btn-primary">

                Salvar

            </button>

        </div>

    </div>

</div>
