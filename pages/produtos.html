<section class="produtos">

    <!-- ==========================================================
         CABEÇALHO
    ========================================================== -->

    <div class="page-header">

        <div>

            <h1>Produtos</h1>

            <p>
                Gerenciamento de produtos da BEQ Empreendimentos.
            </p>

        </div>

        <button
            id="btnNovoProduto"
            class="btn btn-primary"
            type="button">

            <i class="fa-solid fa-plus"></i>

            Novo Produto

        </button>

    </div>


    <!-- ==========================================================
         DASHBOARD
    ========================================================== -->

    <div class="dashboard-cards">

        <div class="card dashboard-card">

            <div>

                <span>Total de Produtos</span>

                <h2 id="totalProdutos">0</h2>

            </div>

            <i class="fa-solid fa-box"></i>

        </div>


        <div class="card dashboard-card">

            <div>

                <span>Itens em Estoque</span>

                <h2 id="totalEstoque">0</h2>

            </div>

            <i class="fa-solid fa-warehouse"></i>

        </div>


        <div class="card dashboard-card">

            <div>

                <span>Valor do Estoque</span>

                <h2 id="valorEstoque">
                    R$ 0,00
                </h2>

            </div>

            <i class="fa-solid fa-sack-dollar"></i>

        </div>

    </div>


    <!-- ==========================================================
         AÇÕES E PESQUISA
    ========================================================== -->

    <div class="table-actions">

        <!-- PESQUISA -->

        <div class="input-icon">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="pesquisarProduto"
                class="form-control"
                placeholder="Pesquisar produto..."
                autocomplete="off">

        </div>


        <!-- MOSTRAR PRODUTOS -->

        <button
            id="btnMostrarProdutos"
            class="btn btn-secondary"
            type="button">

            <i class="fa-solid fa-box-open"></i>

            Mostrar Produtos

        </button>

    </div>


    <!-- ==========================================================
         TABELA DE PRODUTOS
    ========================================================== -->

    <div
        id="cardTabelaProdutos"
        class="card hidden">

        <div class="table-responsive">

            <table class="table">

                <thead>

                    <tr>

                        <th>Código</th>

                        <th>Produto</th>

                        <th>Categoria</th>

                        <th>Preço</th>

                        <th>Estoque</th>

                        <th>Ações</th>

                    </tr>

                </thead>


                <tbody id="listaProdutos">

                    <tr>

                        <td
                            colspan="6"
                            class="empty-table">

                            Nenhum produto cadastrado.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>



<!-- ==========================================================
     MODAL NOVO / EDITAR PRODUTO
========================================================== -->

<div
    id="modalProduto"
    class="modal hidden">

    <div class="modal-content">


        <!-- ======================================================
             CABEÇALHO
        ====================================================== -->

        <div class="modal-header">

            <h2 id="tituloModalProduto">
                Novo Produto
            </h2>


            <button
                id="fecharModalProduto"
                class="btn-close"
                type="button">

                &times;

            </button>

        </div>


        <!-- ======================================================
             CORPO
        ====================================================== -->

        <div class="modal-body">


            <!-- CÓDIGO -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="produtoCodigo">

                    Código

                </label>


                <input
                    id="produtoCodigo"
                    type="text"
                    class="form-control"
                    readonly>

            </div>



            <!-- PRODUTO -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="produtoNome">

                    Produto

                </label>


                <input
                    id="produtoNome"
                    type="text"
                    class="form-control"
                    autocomplete="off">

            </div>



            <!-- CATEGORIA -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="produtoCategoria">

                    Categoria

                </label>


                <select
                    id="produtoCategoria"
                    class="form-control">

                    <option value="">
                        Selecione uma categoria
                    </option>

                </select>

            </div>



<!-- PREÇO -->

<div class="form-group">

    <label
        class="form-label"
        for="produtoPreco">

        Preço

    </label>

    <input
        id="produtoPreco"
        type="number"
        step="0.01"
        min="0"
        class="form-control"
        autocomplete="off">

</div>


<!-- ESTOQUE MÍNIMO -->

<div class="form-group">

    <label
        class="form-label"
        for="produtoEstoqueMinimo">

        Estoque Mínimo

    </label>

    <input
        id="produtoEstoqueMinimo"
        type="number"
        min="0"
        step="1"
        class="form-control"
        placeholder="Ex.: 5"
        autocomplete="off">

</div>


<!-- MARCA -->

<div class="form-group">

    <label
        class="form-label"
        for="produtoMarca">

        Marca

    </label>

    <input
        type="text"
        id="produtoMarca"
        class="form-control"
        placeholder="Ex.: Tramontina"
        autocomplete="off">

</div>

        <!-- ======================================================
             RODAPÉ
        ====================================================== -->

        <div class="modal-footer">

            <button
                id="cancelarProduto"
                class="btn btn-secondary"
                type="button">

                Cancelar

            </button>


            <button
                id="salvarProduto"
                class="btn btn-primary"
                type="button">

                Salvar

            </button>

        </div>

    </div>

</div>
